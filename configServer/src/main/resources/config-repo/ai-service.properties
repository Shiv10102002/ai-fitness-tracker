server.port=8083

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.data.mongodb.uri=mongodb://localhost:27017/airecommendationfitness
spring.data.mongodb.database=airecommendationfitness

# Creates the unique index on recommendations.activityId (idempotent processing).
spring.data.mongodb.auto-index-creation=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=activity-processor-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Poison-pill safe: deserialization errors are captured and routed to the DLT (specs/002, M2).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fitness.aiservice.model.Activity
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fitness.aiservice.model
spring.kafka.consumer.auto-offset-reset=earliest

kafka.topic.name=activity-events

# Google retires models for new API keys (gemini-2.5-flash returned 404 in Nov 2026),
# so the model is an env var rather than code.
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.api.model}:generateContent
# Upper bound per call; on timeout the listener stores the fallback recommendation.
gemini.api.timeout=${GEMINI_TIMEOUT:60s}
gemini.api.key=${GEMINI_API_KEY}

# Continue the producer's trace in @KafkaListener (specs/003, T3).
spring.kafka.listener.observation-enabled=true
