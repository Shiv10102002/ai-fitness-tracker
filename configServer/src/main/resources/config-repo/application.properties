# Shared by every service that fetches its config from the Config Server.

# --- Distributed tracing (specs/003) ---
# Sample everything locally; lower in production (e.g. 0.1).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# OTLP/HTTP collector (Jaeger in docker-compose.yml, UI: http://localhost:16686).
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Jaeger stores traces only; do not push OTLP metrics.
management.otlp.metrics.export.enabled=false
