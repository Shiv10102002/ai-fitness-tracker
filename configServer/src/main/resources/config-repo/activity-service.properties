spring.data.mongodb.uri=mongodb://localhost:27017/aiactivityfitness
server.port=8082
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Consumers bind to their own model class; do not leak producer class names in headers.
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.name=activity-events
# Propagate trace context in Kafka record headers (specs/003, T3).
spring.kafka.template.observation-enabled=true
