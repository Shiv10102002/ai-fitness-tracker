spring.application.name=configServer
spring.profiles.active=native
# Served configuration lives in config-repo/, deliberately NOT in classpath:/config/:
# that is one of Spring Boot's default locations for the Config Server's *own* settings,
# and the native repository does not serve application.* files from there to clients.
spring.cloud.config.server.native.search-locations=classpath:/config-repo/
server.port=8888
