name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [userservice, activityservice, aiservice, gateway, eureka, configServer]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # `verify` runs unit tests (surefire, *Test) and Testcontainers integration
      # tests (failsafe, *IT) against real Postgres / MongoDB / Kafka. Docker is
      # available on GitHub-hosted Ubuntu runners.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports
            ${{ matrix.service }}/target/failsafe-reports

  frontend:
    name: fitness-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitness-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
