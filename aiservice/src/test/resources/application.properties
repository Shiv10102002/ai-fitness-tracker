# Test configuration: shadows src/main/resources/application.properties.
spring.application.name=ai-service
spring.cloud.config.enabled=false
eureka.client.enabled=false
kafka.topic.name=activity-events
spring.kafka.consumer.group-id=activity-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Poison-pill safe: deserialization errors are captured and routed to the DLT (specs/002, M2).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fitness.aiservice.model.Activity
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fitness.aiservice.model
gemini.api.url=http://localhost:0/not-used-in-tests
gemini.api.key=test-key
spring.data.mongodb.auto-index-creation=true

# Tracing is active (propagation is tested) but nothing is exported.
management.tracing.sampling.probability=1.0
# Only the OTLP exporter is off: disabling management.tracing.export.enabled would also
# disable context propagation in Boot 4 (specs/003).
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
spring.kafka.listener.observation-enabled=true
