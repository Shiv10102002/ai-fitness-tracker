# Test configuration: shadows src/main/resources/application.properties.
spring.application.name=ai-service
spring.cloud.config.enabled=false
eureka.client.enabled=false
kafka.topic.name=activity-events
spring.kafka.consumer.group-id=activity-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fitness.aiservice.model.Activity
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fitness.aiservice.model
gemini.api.url=http://localhost:0/not-used-in-tests
gemini.api.key=test-key
