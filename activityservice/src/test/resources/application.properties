# Test configuration: shadows src/main/resources/application.properties.
# No Config Server or Eureka in tests; Mongo/Kafka come from Testcontainers.
spring.application.name=activity-service
spring.cloud.config.enabled=false
eureka.client.enabled=false
kafka.topic.name=activity-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Consumers bind to their own model class; do not leak producer class names in headers.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Tracing is active (propagation is tested) but nothing is exported.
management.tracing.sampling.probability=1.0
# Only the OTLP exporter is off: disabling management.tracing.export.enabled would also
# disable context propagation in Boot 4 (specs/003).
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
spring.kafka.template.observation-enabled=true
